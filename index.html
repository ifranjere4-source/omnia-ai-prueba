
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080808">
<title>OMNIA AI</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100dvh;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

header {
  height: 62px;
  padding: 0 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #242424;
  position: sticky;
  top: 0;
  background: #080808;
  z-index: 5;
}

.brand {
  font-weight: 900;
  letter-spacing: 4px;
}

.icon {
  border: 0;
  color: white;
  background: none;
  font-size: 25px;
  padding: 8px;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 20px 16px 110px;
}

.welcome {
  text-align: center;
  padding: 55px 5px 35px;
}

.logo {
  font-size: 38px;
  font-weight: 900;
  letter-spacing: 8px;
}

.subtitle {
  color: #888;
  margin-top: 12px;
  font-size: 14px;
}

h2 {
  font-size: 17px;
  margin: 28px 0 14px;
}

.modes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.mode {
  min-height: 110px;
  padding: 17px 13px;
  text-align: left;
  color: white;
  background: #141414;
  border: 1px solid #292929;
  border-radius: 13px;
}

.mode:active {
  background: #242424;
}

.mode strong {
  display: block;
  margin-bottom: 9px;
}

.mode small {
  color: #888;
  line-height: 1.4;
}

.models {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}

.model {
  color: white;
  background: #151515;
  border: 1px solid #333;
  border-radius: 25px;
  padding: 11px 14px;
}

.model.active {
  border-color: white;
  background: #292929;
}

#chatPage {
  display: none;
}

#messages {
  display: flex;
  flex-direction: column;
  gap: 15px;
  padding: 15px 0;
}

.message {
  padding: 15px;
  border-radius: 13px;
  background: #151515;
  border: 1px solid #252525;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.5;
}

.message.user {
  background: #222;
  margin-left: 30px;
}

.message.ai {
  margin-right: 10px;
}

.sender {
  display: block;
  color: #aaa;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 9px;
}

.composer {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px;
  background: #080808;
  border-top: 1px solid #252525;
  gap: 8px;
  z-index: 6;
}

.composer input {
  flex: 1;
  min-width: 0;
  background: #171717;
  color: white;
  border: 1px solid #333;
  border-radius: 25px;
  padding: 13px 16px;
  outline: none;
  font-size: 16px;
}

.send {
  width: 46px;
  border: 0;
  border-radius: 50%;
  background: white;
  color: black;
  font-size: 21px;
}

#sidebar, #settings {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #090909;
  padding: 22px;
  overflow-y: auto;
}

.sideItem {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  text-align: left;
  padding: 14px;
  background: #171717;
  border: 1px solid #292929;
  color: white;
  border-radius: 10px;
  margin: 9px 0;
}

.sideTitle {
  overflow: hidden;
  text-overflow: ellipsis;
}

.sideActions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.sideActions button {
  color: #bbb;
  background: #252525;
  border: 0;
  border-radius: 6px;
  padding: 7px;
}

.close {
  float: right;
  background: none;
  color: white;
  border: 0;
  font-size: 27px;
}

.settingBox {
  background: #151515;
  padding: 15px;
  border-radius: 12px;
  margin: 12px 0;
}

.settingBox textarea {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  color: white;
  background: #222;
  border: 1px solid #444;
  border-radius: 8px;
  resize: vertical;
  font-size: 16px;
}

.primary {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 9px;
  background: white;
  color: black;
  font-weight: bold;
  margin-top: 12px;
}

.status {
  color: #999;
  font-size: 12px;
  text-align: center;
  padding: 10px;
}

.demoNotice {
  color: #777;
  font-size: 11px;
  text-align: center;
  padding: 8px;
}

@media(max-width: 420px) {
  .modes {
    gap: 9px;
  }

  .mode {
    padding: 14px 11px;
  }
}
</style>
</head>

<body>

<header>
  <button class="icon" id="backBtn">‹</button>
  <div class="brand">OMNIA AI</div>
  <div>
    <button class="icon" id="historyBtn">☰</button>
    <button class="icon" id="settingsBtn">⚙</button>
  </div>
</header>

<main>

<section id="homePage">
  <div class="welcome">
    <div class="logo">OMNIA</div>
    <div class="subtitle">Tres inteligencias. Una sola experiencia.</div>
  </div>

  <h2>Elegí tu modo</h2>

  <div class="modes">
    <button class="mode" data-mode="individual">
      <strong>Individual</strong>
      <small>Hablá con una IA a elección.</small>
    </button>

    <button class="mode" data-mode="triple">
      <strong>Triple Chat</strong>
      <small>Las tres IA responden por separado.</small>
    </button>

    <button class="mode" data-mode="room">
      <strong>Sala de IA</strong>
      <small>Las IA participan en una misma sala.</small>
    </button>

    <button class="mode" data-mode="supreme">
      <strong>Supremo</strong>
      <small>Una respuesta unificada.</small>
    </button>
  </div>

  <h2>Modelos</h2>

  <div class="models">
    <button class="model active" data-model="chatgpt">ChatGPT</button>
    <button class="model" data-model="claude">Claude</button>
    <button class="model" data-model="gemini">Gemini</button>
  </div>
</section>

<section id="chatPage">
  <h2 id="chatTitle">Conversación</h2>
  <div class="demoNotice">Versión de prueba · Respuestas simuladas</div>
  <div id="messages"></div>
  <div class="status" id="status"></div>
</section>

</main>

<div class="composer" id="composer">
  <input id="messageInput" placeholder="Escribí tu mensaje..." autocomplete="off">
  <button class="send" id="sendBtn">↑</button>
</div>

<aside id="sidebar">
  <button class="close" id="closeHistory">×</button>
  <h2>Historial</h2>
  <button class="primary" id="newChatBtn">+ Nuevo chat</button>
  <div id="historyList"></div>
</aside>

<section id="settings">
  <button class="close" id="closeSettings">×</button>
  <h2>Configuración</h2>

  <div class="settingBox">
    <strong>Instrucciones para las IA</strong>
    <textarea id="instructions" rows="6" placeholder="Escribí cómo querés que respondan las IA..."></textarea>
    <button class="primary" id="saveSettings">Guardar cambios</button>
  </div>

  <div class="settingBox">
    <strong>Información</strong>
    <p style="color:#999">Las conexiones reales con ChatGPT, Claude y Gemini se incorporarán mediante un servidor seguro.</p>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
